name: Check Radar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          python-version: '3.12'
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: npm --prefix apps/twenty-review ci --ignore-scripts
      - run: npm run check
      - run: python3 scripts/check-public.py --history
      - run: uv run --locked radar demo
      - run: uv build
