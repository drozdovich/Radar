[project]
name = "telegram-project-radar"
version = "0.34.0"
description = "Telegram project collection and bounded Twenty Inbox delivery"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=9,<10"]

[project.scripts]
radar = "telegram_project_radar.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_project_radar"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
